# nginx-Site für die Rezepte-Webansicht (nur Heimnetz, eigener Port).
# Installation: siehe README.md → „Webserver (nginx)“.
#   sudo cp deploy/nginx-rezepte.conf /etc/nginx/sites-available/rezepte
#   sudo ln -s /etc/nginx/sites-available/rezepte /etc/nginx/sites-enabled/rezepte
#   sudo nginx -t && sudo systemctl reload nginx

# Cache-Regeln: Daten und App-Code immer frisch prüfen (ETag → meist 304), Icons eine Woche cachen.
map $uri $rezepte_cache_control {
    default                                  "no-cache";
    ~*\.(?:png|svg|ico)$                     "public, max-age=604800";
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/rezepte;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json;

    access_log /var/log/nginx/rezepte.access.log;
    error_log  /var/log/nginx/rezepte.error.log;

    add_header Cache-Control           $rezepte_cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "same-origin" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 512;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien (z. B. temporäre .rezepte-*.json) nie ausliefern
    location ~ /\. {
        deny all;
    }
}
