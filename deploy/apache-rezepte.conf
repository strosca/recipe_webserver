# Apache-VirtualHost für die Rezepte-Webansicht (nur Heimnetz, eigener Port).
# Installation: siehe README.md → „Webserver (Apache)“.
#   sudo a2enmod headers expires deflate
#   sudo cp deploy/apache-rezepte.conf /etc/apache2/sites-available/rezepte.conf
#   sudo a2ensite rezepte && sudo apache2ctl configtest && sudo systemctl reload apache2

Listen 8080

<VirtualHost *:8080>
    DocumentRoot /var/www/rezepte
    DirectoryIndex index.html
    AddDefaultCharset utf-8
    AddType application/manifest+json .webmanifest

    <Directory /var/www/rezepte>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Versteckte Dateien nie ausliefern
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Frame-Options "SAMEORIGIN"
        # Daten und App-Code immer frisch prüfen, Icons eine Woche cachen
        Header set Cache-Control "no-cache"
        <FilesMatch "\.(png|svg|ico)$">
            Header set Cache-Control "public, max-age=604800"
        </FilesMatch>
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json application/manifest+json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/rezepte.error.log
    CustomLog ${APACHE_LOG_DIR}/rezepte.access.log combined
</VirtualHost>
