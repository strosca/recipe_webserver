<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rezepte</title>
  <meta name="description" content="Jeden Morgen zwei neue Rezepte – mit Kochablauf, Timern und Einkaufsliste.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1613" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-view="boot">
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <main id="main" tabindex="-1">
    <div class="state state-loading" aria-busy="true">
      <p>Rezepte werden geladen …</p>
    </div>
  </main>

  <section id="timer-dock" class="timer-dock" aria-label="Laufende Timer" hidden></section>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5zM14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14z"/></svg>
      <span>Rezepte</span>
    </a>
    <a href="#/favoriten" data-tab="fav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.6-4.5-9.4-9.1C1.3 7.9 3.3 4.4 6.9 4.4c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.4 9.1-9.4 9.1z"/></svg>
      <span>Favoriten</span>
    </a>
    <a href="#/einkauf" data-tab="shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.2 11h10.4l2-7.5H6.4"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>
      <span>Einkauf</span>
      <b class="tab-badge" hidden></b>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="state">Bitte JavaScript aktivieren, um die Rezepte zu sehen.</p></noscript>
</body>
</html>
